# The container logs of the LumenBOT instances. `lumenbot-instance setup` installs it as
# /etc/rsyslog.d/30-lumenbot-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. lumenbot-logrotate keeps the files for 30 days.
template(name="OpenbotDockerFile" type="string" string="/var/log/lumenbot/%programname%.log")
template(name="OpenbotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="lumenbot-docker") {
  # The tag is the container name, which lumenbot-instance gives.
  if $programname startswith "lumenbot-" then {
    # setup makes /var/log/lumenbot for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="OpenbotDockerFile" template="OpenbotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/lumenbot-docker/dev/log" ruleset="lumenbot-docker" createPath="off")
