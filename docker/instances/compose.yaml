# One LumenBOT container of several on one host. `lumenbot-instance` runs it with the env file of the
# instance, so each instance has its own project, container, data and limits. See
# docs/docker.md#several-instances-on-one-host.
services:
  lumenbot:
    image: ghcr.io/nightly-labs/lumenbot:${LUMENBOT_TAG:-latest}
    container_name: lumenbot-${LUMENBOT_NAME:?}
    restart: unless-stopped
    security_opt:
      - seccomp=../seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    cpus: ${LUMENBOT_CPUS:?}
    mem_limit: ${LUMENBOT_MEM:?}
    # No swap above the memory limit.
    memswap_limit: ${LUMENBOT_MEM:?}
    pids_limit: 8192
    # The soft limit of Docker is 1024 open files, which is too few for Chromium and agent builds.
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    # The container layer is on the disk of the host and has no size limit, so nothing can write to
    # it. LumenBOT and agents write to /data and to these tmpfs folders, which count toward the memory
    # limit.
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=${LUMENBOT_TMP:-8g}
      - /var/tmp:exec,mode=1777,size=1g
      - /run/lock:mode=1777,size=1m
      # XDG_RUNTIME_DIR: the control socket, D-Bus and the keyring. Main refuses it unless the image
      # user owns it with mode 0700.
      - /run/lumenbot:mode=0700,uid=1000,gid=1000,size=64m
    # The file system of the instance, with its disk limit. LumenBOT only connects out, so the
    # instances publish no port.
    volumes:
      - /srv/lumenbot/${LUMENBOT_NAME:?}/data:/data
      # Updates from the app: LumenBOT writes requests, and root on the host writes the state. See
      # update-request in lumenbot-instance.
      - /srv/lumenbot/${LUMENBOT_NAME:?}/update-requests:/var/lib/lumenbot-update/requests
      - /srv/lumenbot/${LUMENBOT_NAME:?}/update-status:/var/lib/lumenbot-update/status:ro
    # The network of all instances. They cannot reach each other, and lumenbot-firewall lets them
    # reach only the internet.
    networks:
      - lumenbot
    # rsyslog writes the log to /var/log/lumenbot/lumenbot-<name>.log, and logrotate keeps 30 days.
    # `docker logs` reads the local cache of Docker. A line longer than 8 KB is cut.
    logging:
      driver: syslog
      options:
        syslog-address: unixgram:///var/lib/lumenbot-docker/dev/log
        tag: "{{.Name}}"
        # A slow rsyslog never stops LumenBOT. When the buffer is full, lines are lost.
        mode: non-blocking
        max-buffer-size: 4m

networks:
  lumenbot:
    external: true
