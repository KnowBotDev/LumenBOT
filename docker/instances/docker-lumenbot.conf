# Docker starts the LumenBOT containers when it starts. `lumenbot-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/lumenbot.conf.
[Unit]
# No container starts without its firewall: when lumenbot-firewall fails, Docker does not start.
Requires=lumenbot-firewall.service
After=lumenbot-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
